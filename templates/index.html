<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Tracker</title>
</head>
<body>
    <h1>Price Tracker</h1>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            {% for price in prices %}
            <tr>
                <td>{{ price.date }}</td>
                <td>{{ price.name }}</td>
                <td>${{ price.price }}$</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
